<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | The Boys Lab</title>

    <!-- DELETE this line when you are ready to launch publicly. -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --muted: #555555;
            --rule: #000000;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
            max-width: 900px;          /* wider than the main page so photos have room */
            margin: 40px auto 80px;
            padding: 0 20px;
            line-height: 1.6;
        }

        header {
            border-bottom: 1px solid var(--rule);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin: 0;
        }

        a {
            color: var(--text);
            text-underline-offset: 3px;
        }

        a:hover { text-decoration-thickness: 2px; }

        a:focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 3px;
        }

        .back {
            display: inline-block;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .intro {
            font-size: 1.05rem;
            color: var(--muted);
            margin: 0 0 32px;
        }

        /* ---------- Gallery grid ---------- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);  
            gap: 16px;
        }

        .gallery figure {
            margin: 0;
        }

        .gallery img {
            display: block;
            width: 100%;
            height: auto;             
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }

        .gallery figcaption {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 6px;
        }

        footer {
            border-top: 1px solid var(--rule);
            margin-top: 56px;
            padding-top: 12px;
            font-size: 0.9rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>The Boys Lab</h1>
    </header>

    <a class="back" href="index.html">&larr; Return to main</a>

    <h2 style="font-size: 1.3rem; font-weight: 500; margin: 0 0 8px;">Photography</h2>
    <p class="intro">A few photos from outside the lab. Click any image to see it full size.</p>

    <main class="gallery">
        <!-- To add a photo, copy one <figure> block. Use lowercase filenames, no spaces.
             Always fill in alt text (what the photo shows) and width/height (the real pixel size). -->

        <figure>
            <a href="images/gallery/gallery_1.jpg" target="_blank" rel="noopener">
                <img src="images/gallery/gallery_1.jpg" alt="2023 Annular Solar Eclipse, Topaz Mountain Utah" width="1600" height="1067" loading="lazy">
            </a>
            <figcaption>2023 Annular Solar Eclipse, Topaz Mountain Utah</figcaption>
        </figure>

        <figure>
            <a href="images/gallery/gallery_2.jpg" target="_blank" rel="noopener">
                <img src="images/gallery/gallery_2.jpg" alt="Coyotes above SLC" width="1600" height="1067" loading="lazy">
            </a>
            <figcaption>Coyotes above SLC</figcaption>
        </figure>

        <figure>
            <a href="images/gallery/gallery_3.jpg" target="_blank" rel="noopener">
                <img src="images/gallery/gallery_3.jpg" alt="Coyotes above SLC" width="1600" height="1067" loading="lazy">
            </a>
            <figcaption>Coyotes above SLC</figcaption>
        </figure>
        
         <figure>
            <a href="images/gallery/gallery_4.jpg" target="_blank" rel="noopener">
                <img src="images/gallery/gallery_4.jpg" alt="Folds in Moonshine Wash" width="1600" height="1067" loading="lazy">
            </a>
            <figcaption>Folds in Moonshine Wash</figcaption>
        </figure>
        <figure>
            <a href="images/gallery/gallery_5.jpg" target="_blank" rel="noopener">
                <img src="images/gallery/gallery_5.jpg" alt="Aspen in Big Cottonwood Canyon" width="1600" height="1067" loading="lazy">
            </a>
            <figcaption>Aspen in Big Cottonwood Canyon</figcaption>
        </figure>
        
         <figure>
            <a href="images/gallery/gallery_6.jpg" target="_blank" rel="noopener">
                <img src="images/gallery/gallery_6.jpg" alt="Juvenile Moose in Millcreek Canyon" width="1600" height="1067" loading="lazy">
            </a>
            <figcaption>Juvenile Moose in Millcreek Canyon</figcaption>
        </figure>

         <figure>
            <a href="images/gallery/gallery_7.jpg" target="_blank" rel="noopener">
                <img src="images/gallery/gallery_7.jpg" alt="Golden-mantled Ground Squirrel, Little Cottonwood Canyon" width="1600" height="1067" loading="lazy">
            </a>
            <figcaption>Golden-mantled Ground Squirrel, Little Cottonwood Canyon</figcaption>
        </figure>

         <figure>
            <a href="images/gallery/gallery_8.jpg" target="_blank" rel="noopener">
                <img src="images/gallery/gallery_8.jpg" alt="Bentonite Hills, Capitol Reef National Park" width="1600" height="1067" loading="lazy">
            </a>
            <figcaption>Bentonite Hills, Capitol Reef National Park</figcaption>
        </figure>

        
    </main>

    <footer>
        <a href="index.html">&larr; Return to main</a>
    </footer>

</body>
</html>
